<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00674a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayfinding">
<title>Hallandale Beach wayfinding inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme: light;
  --paper:#ffffff; --surface:#f1f5f3; --ink:#10231c; --muted:#56675f; --line:#d3ddd8;
  --guide:#00674a; --guide-strong:#004f39; --on-guide:#ffffff; --amber:#e3a300; --amber-soft:#fff4cf;
  --danger:#b3261e; --focus:#1a73e8;
  --poor:#f8cbad; --fair:#ffe699; --good:#c6e0b4; --exc:#70ad47; --rating-ink:#10231c;
  --radius:10px;
  --font:"Overpass", "Highway Gothic", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0e1915; --surface:#16241f; --ink:#e6efeb; --muted:#9db0a8; --line:#2b3d36;
    --guide:#13845f; --guide-strong:#0f6e4f; --amber:#f2b705; --amber-soft:#3a3214; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0e1915; --surface:#16241f; --ink:#e6efeb; --muted:#9db0a8; --line:#2b3d36;
  --guide:#13845f; --guide-strong:#0f6e4f; --amber:#f2b705; --amber-soft:#3a3214; --danger:#ff8a80;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.4; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--guide); }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:720px; margin:0 auto; }
.hidden{ display:none !important; }

/* Top bar */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--guide); color:var(--on-guide); }
.bar .wrap{ display:flex; align-items:center; gap:10px; padding:10px 14px; min-height:56px; }
.bar h1{ font-size:19px; font-weight:800; margin:0; letter-spacing:.01em; flex:1; line-height:1.15; }
.bar h1 small{ display:block; font-weight:600; font-size:13px; opacity:.85; letter-spacing:0; }
.bar .back{ background:none; border:0; color:var(--on-guide); font-weight:700; padding:8px 4px; display:flex; align-items:center; gap:4px; font-size:16px; }
.sync{ font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.16); white-space:nowrap; }
.sync.warn{ background:var(--amber); color:#10231c; }

/* Guide-sign plate */
.plate{ display:inline-flex; align-items:center; justify-content:center; background:var(--guide); color:var(--on-guide);
  border-radius:7px; box-shadow:inset 0 0 0 2px var(--guide), inset 0 0 0 4px var(--on-guide); font-weight:800; line-height:1;
  min-width:52px; height:44px; padding:4px 10px 0; font-size:22px; letter-spacing:.02em; flex:none; }
.plate.prop{ background:var(--paper); color:var(--guide); box-shadow:inset 0 0 0 3px var(--guide); border-style:dashed; }
.plate.new{ font-size:14px; }

/* Home */
.hero{ padding:18px 14px 6px; }
.progress{ display:flex; align-items:baseline; gap:8px; font-weight:700; }
.progress b{ font-size:30px; font-weight:800; color:var(--guide); }
.meter{ height:8px; background:var(--surface); border-radius:99px; overflow:hidden; margin:8px 0 14px; border:1px solid var(--line); }
.meter span{ display:block; height:100%; background:var(--guide); }
.actions{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ border:2px solid var(--guide); background:var(--paper); color:var(--guide); font-weight:800; border-radius:var(--radius); padding:12px 16px 10px; min-height:48px; font-size:16px; }
.btn.primary{ background:var(--guide); color:var(--on-guide); }
.btn.grow{ flex:1 1 160px; }
.btn:disabled{ opacity:.55; }
.btn.danger{ border-color:var(--danger); color:var(--danger); }
.tools{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 56px); z-index:4; background:var(--paper); padding:10px 14px; border-bottom:1px solid var(--line); }
.search{ width:100%; border:2px solid var(--line); border-radius:var(--radius); padding:11px 12px 9px; background:var(--paper); font-size:17px; }
.seg{ display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none; }
.seg button{ flex:none; border:1.5px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 13px 5px; font-weight:700; font-size:14px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.group{ padding:16px 14px 4px; font-size:14px; font-weight:800; color:var(--muted); }
.list{ list-style:none; margin:0; padding:0; }
.row{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0; }
.row:active{ background:var(--surface); }
.row .txt{ flex:1; min-width:0; }
.row .loc{ font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .meta{ font-size:13px; color:var(--muted); margin-top:2px; }
.status{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:12px; font-weight:700; color:var(--muted); }
.dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--line); background:var(--paper); }
.dot.prog{ background:var(--amber); border-color:var(--amber); }
.dot.done{ background:var(--guide); border-color:var(--guide); }
.chipr{ font-size:11px; font-weight:800; padding:2px 7px 1px; border-radius:4px; color:var(--rating-ink); }
.empty{ padding:28px 14px; color:var(--muted); }

/* Sign page */
.head{ padding:16px 14px 8px; display:flex; gap:14px; align-items:flex-start; }
.head .plate{ height:64px; min-width:72px; font-size:32px; }
.head .plate.new{ font-size:17px; }
.head h2{ margin:0; font-size:21px; line-height:1.2; font-weight:800; }
.head .meta{ color:var(--muted); font-size:14px; margin-top:4px; }
.prelim{ margin:6px 14px 4px; background:var(--surface); border-radius:var(--radius); padding:12px 14px; font-size:15px; border-left:4px solid var(--amber); }
.prelim h3{ margin:0 0 4px; font-size:13px; font-weight:800; color:var(--muted); }
.prelim p{ margin:0 0 6px; }
.prelim .files{ font-size:13px; color:var(--muted); word-break:break-all; margin:0; }
section.sec{ padding:6px 14px 10px; border-top:8px solid var(--surface); margin-top:12px; }
section.sec > h3{ display:flex; justify-content:space-between; align-items:baseline; font-size:20px; font-weight:800; margin:12px 0 6px; }
section.sec > h3 span{ font-size:13px; color:var(--muted); font-weight:700; }
.field{ padding:10px 0; }
.field + .field{ border-top:1px solid var(--line); }
.lbl{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; }
.lbl .hint{ font-weight:600; color:var(--muted); font-size:14px; }
.info{ border:1.5px solid var(--line); background:var(--paper); border-radius:50%; width:30px; height:30px; font-weight:800; font-size:15px; flex:none; line-height:1; padding-top:3px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:2px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px 8px; font-weight:700; font-size:15px; min-height:44px; text-align:left; }
.chip[aria-pressed="true"]{ background:var(--guide); border-color:var(--guide); color:var(--on-guide); }
.chip.other[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.rates{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.rate{ border:2px solid var(--line); background:var(--paper); border-radius:8px; padding:12px 2px 10px; font-weight:800; font-size:15px; min-height:50px; }
.rate[aria-pressed="true"]{ color:var(--rating-ink); border-color:var(--rating-ink); }
.rate[data-r="Poor"][aria-pressed="true"]{ background:var(--poor); }
.rate[data-r="Fair"][aria-pressed="true"]{ background:var(--fair); }
.rate[data-r="Good"][aria-pressed="true"]{ background:var(--good); }
.rate[data-r="Excellent"][aria-pressed="true"]{ background:var(--exc); }
.def{ font-size:14px; color:var(--muted); margin-top:7px; min-height:1em; }
.defs{ margin-top:8px; display:grid; gap:6px; font-size:14px; }
.defs div{ padding:8px 10px; border-radius:8px; color:var(--rating-ink); }
.yn{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.yn + .yn{ border-top:1px solid var(--line); }
.yn .q{ flex:1; font-weight:600; }
.yn .b{ display:flex; gap:6px; }
.yn button{ border:2px solid var(--line); background:var(--paper); border-radius:8px; min-width:60px; min-height:44px; font-weight:800; padding-top:3px; }
.yn button[aria-pressed="true"][data-val="Yes"]{ background:var(--guide); border-color:var(--guide); color:var(--on-guide); }
.yn button[aria-pressed="true"][data-val="No"]{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
input.text, textarea{ width:100%; border:2px solid var(--line); border-radius:8px; padding:11px 12px 9px; background:var(--paper); font-size:17px; }
textarea{ min-height:88px; resize:vertical; line-height:1.4; }
input.text:focus, textarea:focus{ border-color:var(--guide); outline:none; }
.ftin{ display:flex; align-items:center; gap:8px; font-weight:700; }
.ftin input{ width:84px; text-align:center; }
.linkbtn{ background:none; border:0; color:var(--guide); font-weight:700; padding:6px 0; font-size:14px; text-decoration:underline; }
.overall{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius); background:var(--surface); font-weight:800; }
.overall .val{ padding:6px 12px 4px; border-radius:6px; color:var(--rating-ink); font-size:18px; }
.choose{ margin:14px; padding:14px; border:2px dashed var(--amber); border-radius:var(--radius); background:var(--amber-soft); font-weight:600; }
.foot{ position:sticky; bottom:0; z-index:5; background:var(--paper); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.foot .wrap{ display:flex; gap:8px; padding:8px 14px; }
.foot .btn{ flex:1; padding:10px 8px 8px; font-size:15px; }
.danger-zone{ padding:24px 14px 30px; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 84px); background:var(--ink); color:var(--paper);
  padding:12px 16px 10px; border-radius:10px; font-weight:700; z-index:20; max-width:min(92vw,480px); box-shadow:0 6px 24px rgba(0,0,0,.25); }
.note{ margin:10px 14px 0; padding:10px 12px; border-radius:8px; background:var(--amber-soft); font-size:14px; font-weight:600; }
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; transition:none !important; } }

/* Standalone additions */
.settings{ display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14px; color:var(--muted); font-weight:600; flex-wrap:wrap; }
.settings input{ width:90px; border:2px solid var(--line); border-radius:8px; padding:7px 8px 5px; background:var(--paper); text-transform:uppercase; font-weight:700; }
.lastexp{ font-size:13px; color:var(--muted); margin-top:8px; font-weight:600; }
.modal{ position:fixed; inset:0; z-index:30; background:rgba(8,20,15,.55); display:flex; align-items:flex-end; justify-content:center; padding:0; }
.sheet{ background:var(--paper); color:var(--ink); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
@media (min-width:600px){ .modal{ align-items:center; } .sheet{ border-radius:16px; } }
.sheet h2{ margin:0 0 8px; font-size:21px; font-weight:800; }
.sheet p{ margin:0 0 10px; }
.sheet ul{ margin:0 0 12px; padding-left:20px; font-size:15px; }
.sheet .stack{ display:grid; gap:10px; margin-top:14px; }
.sheet .stack .btn{ width:100%; }
.conf{ background:var(--surface); border-radius:8px; padding:10px 12px; font-size:14px; max-height:220px; overflow:auto; margin-bottom:8px; }
.conf div + div{ margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
.foot-links{ padding:10px 14px 34px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }

</style>
</head>

    Object.keys(rows).forEach((rn) => {

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const L = DATA.labels, LISTS = DATA.lists;
const REFS = DATA.refs.slice().sort((a,b)=>a.n-b.n);
const REF_BY_ID = {}; REFS.forEach(r => { REF_BY_ID["s" + String(r.n).padStart(2,"0")] = r; });
const REF_BY_NUM = {}; REFS.forEach(r => { REF_BY_NUM[r.n] = r; });
const LEGEND = {};
const legendKey = { "Legibility":"leg", "Visibility":"vis", "Placement":"plc", "Safety / Clearance":"saf", "Overall Site Conditions":"site" };
DATA.legend.forEach(row => { const k = legendKey[String(row[0]).split("\n")[0].trim()]; if (k) LEGEND[k] = row.slice(1); });
const RCOLOR = { Poor:"var(--poor)", Fair:"var(--fair)", Good:"var(--good)", Excellent:"var(--exc)" };
const KEY_BY_ROW = {}; Object.keys(ROW).forEach(k => { KEY_BY_ROW[ROW[k]] = k; });
const FIELD_NAME = k => k === "addr" ? "Address" : k === "ep" ? "Existing / Proposed" : String(L[ROW[k]] || k).replace(/^\d\.\s*/, "").replace(/\s*\(.*\)$/, "");

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel, el=document) => el.querySelector(sel);

/* ---------- storage: everything stays on this device ---------- */
const LS_REC = "hbwf.records.v1", LS_META = "hbwf.meta.v1";
let records = {}, meta = {};
try { records = JSON.parse(localStorage.getItem(LS_REC) || "{}") || {}; } catch(e) { records = {}; }
try { meta = JSON.parse(localStorage.getItem(LS_META) || "{}") || {}; } catch(e) { meta = {}; }
let storageOk = true;
function saveLocal(){
  try { localStorage.setItem(LS_REC, JSON.stringify(records)); localStorage.setItem(LS_META, JSON.stringify(meta)); storageOk = true; }
  catch(e) { storageOk = false; toast("This phone couldn’t save the last change. Export now to keep a copy."); }
  setSync();
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
function setSync(){
  const el = $("#sync"); if (!el) return;
  el.textContent = storageOk ? "Saved" : "Not saving";
  el.title = storageOk ? "Your entries are saved on this phone" : "";
  el.classList.toggle("warn", !storageOk);
}

/* ---------- record helpers ---------- */
function refOf(id){ return REF_BY_ID[id] || null; }
function getRec(id){ return records[id] || { id, ref: refOf(id) ? String(refOf(id).n).padStart(2,"0") : "NEW", v:{}, createdAt: Date.now(), updatedAt: 0 }; }
function val(id, k){
  const rec = records[id], ref = refOf(id), v = rec ? rec.v : {};
  if (k === "addr") return v.addr != null ? v.addr : (ref ? ref.loc : "");
  if (k === "ep") return v.ep != null ? v.ep : (ref ? ref.ep : "");
  return v[k] == null ? "" : v[k];
}
function setVal(id, k, value){
  const rec = getRec(id), ref = refOf(id);
  const v = Object.assign({}, rec.v);
  const isAuto = ref && ((k === "addr" && value === ref.loc) || (k === "ep" && value === ref.ep));
  if (isAuto || value === "" || value == null) delete v[k]; else v[k] = value;
  rec.v = v; rec.updatedAt = Date.now();
  records[id] = rec; saveLocal();
}
function hasData(id){ const r = records[id]; return !!(r && Object.keys(r.v || {}).some(k => r.v[k] !== "" && r.v[k] != null)); }
function statusOf(id){
  if (!hasData(id)) return "todo";
  const ep = val(id, "ep");
  const req = ep === "Existing" ? ["leg","vis","plc","saf","family","action"]
            : ep === "Proposed" ? ["site","userType","locWorks"] : ["ep"];
  return req.every(k => val(id, k) !== "") ? "done" : "prog";
}
function allIds(){
  const ids = REFS.map(r => "s" + String(r.n).padStart(2,"0"));
  const extra = Object.keys(records).filter(id => !REF_BY_ID[id]).sort((a,b) => (records[a].createdAt||0) - (records[b].createdAt||0));
  return ids.concat(extra);
}
function plateFor(id){ const r = refOf(id); return r ? String(r.n).padStart(2,"0") : "NEW"; }
function locFor(id){ return val(id, "addr") || "New sign – add a location"; }
const newId = () => "n-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- views ---------- */
let filter = "all", query = "";
function currentId(){ const h = location.hash.slice(1); return h && (REF_BY_ID[h] || records[h]) ? h : null; }
function render(){
  const id = currentId();
  if (location.hash.slice(1) && !id) history.replaceState(null, "", location.pathname + location.search);
  if (id) renderSign(id); else renderHome();
  setSync();
}
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined, { month:"short", day:"numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }); }

function renderHome(){
  const ids = allIds();
  const logged = REFS.filter(r => statusOf("s" + String(r.n).padStart(2,"0")) !== "todo").length;
  const done = REFS.filter(r => statusOf("s" + String(r.n).padStart(2,"0")) === "done").length;
  const extraCount = ids.filter(i => !REF_BY_ID[i]).length;
  const anyData = ids.some(hasData);
  document.getElementById("app").innerHTML = `
  <header class="bar"><div class="wrap"><h1>Wayfinding field inventory<small>Hallandale Beach</small></h1><span class="sync" id="sync"></span></div></header>
  <main class="wrap">
    ${!storageOk ? `<div class="note">This phone isn’t saving changes, possibly because storage is full or private browsing is on. Export now to keep your work.</div>` : ""}
    <div class="hero">
      <div class="progress"><b>${logged}</b> of ${REFS.length} reference signs logged${done ? `, ${done} complete` : ""}${extraCount ? `, plus ${extraCount} new` : ""}</div>
      <div class="meter" aria-hidden="true"><span style="width:${Math.round(logged / REFS.length * 100)}%"></span></div>
      <div class="actions">
        <button class="btn primary grow" id="export">Export to Excel</button>
        <button class="btn grow" id="import">Import Excel files</button>
      </div>
      <div class="lastexp">${meta.lastExport ? `Last exported ${esc(fmtDate(meta.lastExport))}` : (anyData ? "Not exported yet. Export at the end of each day as a backup." : "")}</div>
      <div class="settings"><label for="initials">Your initials, added to exported file names</label>
        <input id="initials" maxlength="5" autocomplete="off" value="${esc(meta.initials || "")}" placeholder="e.g. JD"></div>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search by sign number or street" value="${esc(query)}" autocomplete="off">
      <div class="seg" role="group" aria-label="Filter">
        ${[["all","All"],["todo","Not done"],["existing","Existing"],["proposed","Proposed"]].map(([k,t]) => `<button data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join("")}
      </div>
    </div>
    <div id="listbox"></div>
    <div class="foot-links">
      <button class="linkbtn" id="addNew">Add a sign not on the list</button>
      ${anyData ? `<button class="linkbtn" id="clearAll" style="color:var(--danger)">Clear all entries on this phone</button>` : ""}
    </div>
  </main>
  <input type="file" id="filepick" class="hidden" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">`;
  $("#q").addEventListener("input", (e) => { query = e.target.value; renderList(); });
  $("#initials").addEventListener("input", (e) => { meta.initials = e.target.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase(); saveLocal(); });
  $("#filepick").addEventListener("change", (e) => { const files = Array.from(e.target.files || []); e.target.value = ""; if (files.length) importFiles(files); });
  renderList();
  setSync();
}
function renderList(){
  const ids = allIds();
  const q = query.trim().toLowerCase();
  const shown = ids.filter(id => {
    const ep = val(id, "ep"), st = statusOf(id);
    if (filter === "existing" && ep !== "Existing") return false;
    if (filter === "proposed" && ep !== "Proposed") return false;
    if (filter === "todo" && st === "done") return false;
    if (q) { const hay = (plateFor(id) + " " + locFor(id) + " " + (refOf(id) ? refOf(id).cat : "")).toLowerCase(); if (!hay.includes(q) && String(Number(plateFor(id))) !== q) return false; }
    return true;
  });
  const rowHtml = id => {
    const ref = refOf(id), ep = val(id, "ep"), st = statusOf(id);
    const score = ep === "Existing" ? overallScore((records[id]||{}).v||{}) : val(id, "site");
    const stTxt = st === "done" ? "Done" : st === "prog" ? "Started" : "To do";
    return `<li><button class="row" data-go="${esc(id)}">
      <span class="plate ${ep === "Proposed" ? "prop" : ""} ${ref ? "" : "new"}">${esc(plateFor(id))}</span>
      <span class="txt"><span class="loc">${esc(locFor(id))}</span>
      <span class="meta">${esc([ep || "Existing or proposed not set", ref ? ref.cat : "Not on reference list"].join(", "))}</span></span>
      <span class="status"><span class="dot ${st}"></span>${stTxt}${RCOLOR[score] ? `<span class="chipr" style="background:${RCOLOR[score]}">${esc(score)}</span>` : ""}</span>
    </button></li>`;
  };
  const refShown = shown.filter(i => REF_BY_ID[i]), newShown = shown.filter(i => !REF_BY_ID[i]);
  $("#listbox").innerHTML = `
    ${refShown.length ? `<div class="group">Reference signs</div><ul class="list">${refShown.map(rowHtml).join("")}</ul>` : ""}
    ${newShown.length ? `<div class="group">Not on the reference list</div><ul class="list">${newShown.map(rowHtml).join("")}</ul>` : ""}
    ${!shown.length ? `<p class="empty">No signs match. Clear the search or pick another filter.</p>` : ""}`;
}

const SECTIONS = {
  ratings: [["leg",12],["vis",13],["plc",14],["saf",15]],
  works: [["w1",18],["w2",19],["w3",20],["w4",21],["w5",22],["w6",23],["w7",24]],
  doesnt: [["d1",27],["d2",28],["d3",29],["d4",30],["d5",31],["d6",32],["d7",33]],
};
const shortLbl = row => String(L[row]).replace(/^\d\.\s*/, "");
function chipsField(id, k, label, list, allowOther){
  const cur = val(id, k);
  const isOther = cur !== "" && !list.includes(cur);
  return `<div class="field"><div class="lbl">${esc(label)}</div><div class="chips">
    ${list.map(o => `<button class="chip" data-k="${k}" data-val="${esc(o)}" aria-pressed="${cur===o}">${esc(o)}</button>`).join("")}
    ${allowOther ? `<button class="chip other" data-other="${k}" aria-pressed="${isOther}">Other…</button>` : ""}
  </div>
  ${allowOther ? `<input class="text ${isOther ? "" : "hidden"}" style="margin-top:8px" data-text="${k}" data-otherinput="${k}" placeholder="Type your own" value="${isOther ? esc(cur) : ""}">` : ""}
  </div>`;
}
function ratingField(id, k, label){
  const cur = val(id, k), defs = LEGEND[k] || [];
  const i = RATINGS.indexOf(cur);
  return `<div class="field"><div class="lbl"><span>${esc(label)}</span><button class="info" data-info="${k}" aria-label="Show rating guide">?</button></div>
    <div class="rates">${RATINGS.map(r => `<button class="rate" data-k="${k}" data-val="${r}" data-r="${r}" aria-pressed="${cur===r}">${r}</button>`).join("")}</div>
    <div class="def">${i >= 0 ? esc(defs[i] || "") : (cur ? `Saved as “${esc(cur)}”.` : "")}</div>
    <div class="defs hidden" id="defs-${k}">${RATINGS.map((r,j) => `<div style="background:${RCOLOR[r]}"><b>${r}:</b> ${esc(defs[j] || "")}</div>`).join("")}</div>
  </div>`;
}
function ynRows(id, pairs){
  return pairs.map(([k,row]) => { const cur = val(id, k); return `<div class="yn"><span class="q">${esc(shortLbl(row))}</span><span class="b">
    ${["Yes","No"].map(o => `<button data-k="${k}" data-val="${o}" aria-pressed="${cur===o}">${o}</button>`).join("")}</span></div>`; }).join("");
}
function textField(id, k, label, multi, placeholder){
  const cur = val(id, k);
  return `<div class="field"><label class="lbl" for="t-${k}">${esc(label)}</label>
    ${multi ? `<textarea id="t-${k}" data-text="${k}" placeholder="${esc(placeholder||"")}">${esc(cur)}</textarea>`
            : `<input id="t-${k}" class="text" data-text="${k}" value="${esc(cur)}" placeholder="${esc(placeholder||"")}">`}
  </div>`;
}
function parseFtIn(s){ const m = String(s||"").match(/^\s*(\d+)\s*'\s*-?\s*(\d+)?/); return m ? [m[1], m[2] || "0"] : ["",""]; }
function countFilled(id, keys){ return keys.filter(k => val(id, k) !== "").length; }

function renderSign(id){
  const ref = refOf(id), ep = val(id, "ep"), ids = allIds(), idx = ids.indexOf(id);
  const prev = ids[idx-1], next = ids[idx+1];
  const [ft, inch] = parseFtIn(val(id, "clearance"));
  const clearanceRaw = val(id, "clearance");
  const ftinOk = clearanceRaw === "" || /^\d+'-\d+"$/.test(clearanceRaw);
  const v = (records[id] || {}).v || {};
  const score = overallScore(v);
  const addrChanged = ref && v.addr != null;
  const exist = ep === "Existing", prop = ep === "Proposed";
  document.getElementById("app").innerHTML = `
  <header class="bar"><div class="wrap"><button class="back" data-go="">‹ All signs</button><span style="flex:1"></span><span class="sync" id="sync"></span></div></header>
  <main class="wrap">
    <div class="head">
      <span class="plate ${prop ? "prop" : ""} ${ref ? "" : "new"}">${esc(plateFor(id))}</span>
      <div><h2>${esc(locFor(id))}</h2><div class="meta">${esc(ref ? ref.cat : "Not on the reference list")}</div></div>
    </div>
    ${ref && (ref.rem || ref.note || ref.p1) ? `<div class="prelim"><h3>From the preliminary document</h3>
      ${ref.rem ? `<p>${esc(ref.rem)}</p>` : ""}${ref.note ? `<p><b>Note:</b> ${esc(ref.note)}</p>` : ""}
      ${ref.p1 ? `<p class="files">Photos: ${esc([ref.p1, ref.p2].filter(Boolean).join(", "))}</p>` : ""}</div>` : ""}

    <section class="sec"><h3>Sign identification</h3>
      <div class="field"><div class="lbl">Existing or proposed</div><div class="chips">
        ${LISTS.ExistProp.map(o => `<button class="chip" data-k="ep" data-val="${o}" aria-pressed="${ep===o}">${o}</button>`).join("")}</div>
        ${ep && !LISTS.ExistProp.includes(ep) ? `<div class="def">Saved as “${esc(ep)}”. Pick one above.</div>` : ""}</div>
      <div class="field"><label class="lbl" for="t-addr"><span>Address / location description</span>${addrChanged ? `<button class="linkbtn" data-resetaddr="1">Use reference address</button>` : ""}</label>
        <input id="t-addr" class="text" data-text="addr" value="${esc(val(id,"addr"))}" placeholder="Street address or description"></div>
      ${chipsField(id, "family", "Sign family", LISTS.Family, true)}
      ${chipsField(id, "action", "Action", LISTS.Action, true)}
      ${chipsField(id, "direction", "Direction of travel facing sign", LISTS.Direction, true)}
      <div class="field"><div class="lbl">Vertical clearance</div>
        <div class="ftin"><input class="text" inputmode="numeric" pattern="[0-9]*" data-ft="1" value="${esc(ft)}" aria-label="Feet"> ft
        <input class="text" inputmode="numeric" pattern="[0-9]*" data-in="1" value="${esc(ft ? inch : "")}" aria-label="Inches"> in</div>
        ${!ftinOk ? `<div class="def">Saved as “${esc(clearanceRaw)}”. Enter feet and inches to replace it.</div>` : ""}
      </div>
    </section>

    ${!exist && !prop ? `<div class="choose">Choose Existing or Proposed above to show the right questions for this sign.</div>` : ""}

    ${exist ? `<section class="sec"><h3>Ratings <span>${countFilled(id, ["leg","vis","plc","saf"])} of 4</span></h3>
      ${SECTIONS.ratings.map(([k,row]) => ratingField(id, k, L[row])).join("")}
      <div class="field"><div class="overall">Overall score <span class="val" style="background:${score ? RCOLOR[score] : "transparent"}">${score || "Rate all four to see it"}</span></div></div>
    </section>
    <section class="sec"><h3>What works <span>${countFilled(id, SECTIONS.works.map(x=>x[0]))} of 7</span></h3>
      ${ynRows(id, SECTIONS.works)}
      ${textField(id, "wNotes", "What works – notes", true)}
    </section>
    <section class="sec"><h3>What doesn’t work <span>${countFilled(id, SECTIONS.doesnt.map(x=>x[0]))} of 7</span></h3>
      ${ynRows(id, SECTIONS.doesnt)}
      ${textField(id, "dNotes", "What doesn’t work – notes", true)}
    </section>` : ""}

    ${prop ? `<section class="sec"><h3>Site conditions</h3>
      ${ratingField(id, "site", L[36])}
      ${chipsField(id, "userType", L[37], LISTS.UserType, true)}
      ${chipsField(id, "sight", L[38], LISTS.Sightline, true)}
      <div class="field">${ynRows(id, [["obst",39]])}</div>
      ${textField(id, "obstDesc", L[40], true)}
      ${chipsField(id, "locWorks", L[41], LISTS.LocWorks, true)}
      ${textField(id, "alt", L[42], true)}
      ${textField(id, "opp", L[43], true)}
      ${textField(id, "con", L[44], true)}
    </section>` : ""}

    <section class="sec"><h3>General notes</h3>
      ${textField(id, "notes", "General notes / opportunities", true)}
    </section>

    <div class="danger-zone">
      ${ref ? `<button class="btn danger" data-clear="1" ${hasData(id) ? "" : "disabled"}>Clear entries for this sign</button>`
            : `<button class="btn danger" data-clear="1">Delete this sign</button>`}
    </div>
  </main>
  <nav class="foot"><div class="wrap">
    <button class="btn" ${prev ? `data-go="${esc(prev)}"` : "disabled"}>‹ ${prev ? esc(plateFor(prev)) : "Prev"}</button>
    <button class="btn primary" data-go="">Done</button>
    <button class="btn" ${next ? `data-go="${esc(next)}"` : "disabled"}>${next ? esc(plateFor(next)) : "Next"} ›</button>
  </div></nav>`;
  document.querySelectorAll("textarea").forEach(autosize);
}

/* ---------- interactions ---------- */
const app = document.getElementById("app");
app.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go !== undefined) { go(t.dataset.go); return; }
  if (t.dataset.f) { filter = t.dataset.f; app.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter))); renderList(); return; }
  if (t.id === "export") { exportExcel(t); return; }
  if (t.id === "import") { $("#filepick").click(); return; }
  if (t.id === "clearAll") {
    if (!confirm("Delete every entry saved on this phone? Export first if you need a copy. This can’t be undone.")) return;
    records = {}; saveLocal(); renderHome(); toast("All entries on this phone were cleared."); return;
  }
  if (t.id === "addNew") {
    const id = newId();
    records[id] = { id, ref:"NEW", v:{}, createdAt: Date.now(), updatedAt: Date.now() };
    saveLocal(); go(id); return;
  }
  const id = currentId(); if (!id) return;
  if (t.dataset.info) { document.getElementById("defs-" + t.dataset.info).classList.toggle("hidden"); return; }
  if (t.dataset.resetaddr) { const r = getRec(id); const v = Object.assign({}, r.v); delete v.addr; r.v = v; r.updatedAt = Date.now(); records[id] = r; saveLocal(); renderSign(id); setSync(); return; }
  if (t.dataset.other) {
    const k = t.dataset.other, inp = app.querySelector(`[data-otherinput="${k}"]`);
    if (t.getAttribute("aria-pressed") === "true") { setVal(id, k, ""); renderSign(id); setSync(); return; }
    app.querySelectorAll(`.chip[data-k="${k}"]`).forEach(b => b.setAttribute("aria-pressed","false"));
    t.setAttribute("aria-pressed","true"); inp.classList.remove("hidden"); inp.value = ""; inp.focus();
    return;
  }
  if (t.dataset.clear) {
    const msg = refOf(id) ? "Clear everything entered for this sign? This can’t be undone." : "Delete this sign and everything entered for it? This can’t be undone.";
    if (!confirm(msg)) return;
    delete records[id]; saveLocal();
    if (refOf(id)) { renderSign(id); setSync(); } else go("");
    return;
  }
  if (t.dataset.k) {
    const k = t.dataset.k, v = t.dataset.val;
    setVal(id, k, val(id, k) === v && k !== "ep" ? "" : v);
    renderSign(id); setSync();
  }
});
const textTimers = {};
app.addEventListener("input", (e) => {
  const el = e.target, id = currentId(); if (!id) return;
  if (el.dataset.text) {
    const k = el.dataset.text;
    clearTimeout(textTimers[k]);
    textTimers[k] = setTimeout(() => { textTimers[k] = null; setVal(id, k, el.value); if (k === "addr") { const h = $(".head h2"); if (h) h.textContent = locFor(id); } }, 300);
    if (el.tagName === "TEXTAREA") autosize(el);
  } else if (el.dataset.ft !== undefined || el.dataset.in !== undefined) {
    const ft = $("[data-ft]").value.replace(/\D/g,""), inch = $("[data-in]").value.replace(/\D/g,"");
    clearTimeout(textTimers.clr);
    textTimers.clr = setTimeout(() => setVal(id, "clearance", ft === "" && inch === "" ? "" : `${ft || 0}'-${inch || 0}"`), 300);
  }
});
app.addEventListener("focusout", (e) => {
  const el = e.target, id = currentId(); if (!id || !el.dataset || !el.dataset.text) return;
  const k = el.dataset.text;
  if (textTimers[k]) { clearTimeout(textTimers[k]); textTimers[k] = null; if (val(id, k) !== el.value) setVal(id, k, el.value); }
});
// Save anything still being typed if the app is closed or sent to the background.
function flushTyping(){
  const id = currentId(); if (!id) return;
  app.querySelectorAll("[data-text]").forEach(el => { const k = el.dataset.text; if (textTimers[k]) { clearTimeout(textTimers[k]); textTimers[k] = null; if (val(id, k) !== el.value) setVal(id, k, el.value); } });
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushTyping(); });
window.addEventListener("pagehide", flushTyping);
function autosize(el){ el.style.height = "auto"; el.style.height = Math.max(88, el.scrollHeight + 4) + "px"; }

let lastHomeScroll = 0;
function go(id){
  if (!currentId()) lastHomeScroll = window.scrollY;
  flushTyping();
  if (id) location.hash = id; else if (location.hash) location.hash = "";
}
window.addEventListener("hashchange", () => {
  render();
  window.scrollTo(0, currentId() ? 0 : lastHomeScroll);
});

let toastTimer;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hidden"), 4200); }

/* ---------- bottom sheet ---------- */
function openSheet(html, onClick){
  closeSheet();
  const m = document.createElement("div");
  m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("click", (e) => {
    if (e.target === m) { closeSheet(); return; }
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "cancel") { closeSheet(); return; }
    onClick && onClick(b.dataset.act, b);
  });
  document.body.appendChild(m);
  const first = m.querySelector("button"); if (first) first.focus();
}
function closeSheet(){ const m = document.getElementById("modal"); if (m) m.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- export ---------- */
function exportOrder(){
  return allIds().filter(hasData).sort((a,b) => {
    const ra = refOf(a), rb = refOf(b);
    if (ra && rb) return ra.n - rb.n;
    if (ra) return -1; if (rb) return 1;
    return (records[a].createdAt||0) - (records[b].createdAt||0);
  });
}
async function exportExcel(btn){
  flushTyping();
  const ids = exportOrder();
  if (!ids.length) { toast("Nothing to export yet. Fill in at least one sign first."); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Building file…";
  let blob, name;
  try {
    const cols = ids.map(id => ({ cells: recordToCells(records[id], refOf(id)) }));
    const zip = await buildWorkbook(JSZip, DOMParser, XMLSerializer, TEMPLATE_B64, cols);
    blob = await zip.generateAsync({ type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const d = new Date(), pad = n => String(n).padStart(2,"0");
    name = `Hallandale_Wayfinding_Field_Inventory_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${meta.initials ? "_" + meta.initials : ""}.xlsx`;
  } catch(e) {
    toast("The Excel file couldn’t be built. Try again.");
    btn.disabled = false; btn.textContent = label; return;
  }
  btn.disabled = false; btn.textContent = label;
  const file = new File([blob], name, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  openSheet(`<h2>Excel file ready</h2>
    <p>${ids.length} sign${ids.length === 1 ? "" : "s"} in ${esc(name)}</p>
    <div class="stack">
      ${canShare ? `<button class="btn primary" data-act="share">Share or save to Files</button>` : ""}
      <button class="btn ${canShare ? "" : "primary"}" data-act="download">Download</button>
      <button class="btn" data-act="cancel" style="border-color:var(--line);color:var(--ink)">Close</button>
    </div>`, async (act) => {
    if (act === "share") {
      try { await navigator.share({ files: [file], title: name }); markExported(); closeSheet(); }
      catch(e) { if (e && e.name !== "AbortError") toast("Sharing didn’t work here. Use Download instead."); }
    } else if (act === "download") {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      markExported(); closeSheet(); toast("Downloaded " + name);
    }
  });
}
function markExported(){ meta.lastExport = Date.now(); saveLocal(); if (!currentId()) renderHome(); }

/* ---------- import ---------- */
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function columnToEntry(cells){
  // Turn one INVENTORY column into {id hint, v}
  const label = cells[3] || "";
  const m = /^\s*(\d{1,3})\s*[–—-]/.exec(label);
  const ref = m ? REF_BY_NUM[Number(m[1])] : null;
  const v = {};
  Object.keys(cells).forEach(r => {
    r = Number(r); const k = KEY_BY_ROW[r]; if (k) v[k] = cells[r];
  });
  if (cells[4] != null && !(ref && cells[4] === ref.loc)) v.addr = cells[4];
  if (cells[6] != null && !(ref && cells[6] === ref.ep)) v.ep = cells[6];
  return { ref, v };
}
function planImport(entries){
  // Work on a scratch copy so several files merge in order.
  const scratch = JSON.parse(JSON.stringify(records));
  const ops = [], status = {}, seenConf = new Set();
  const conflicts = [];
  entries.forEach(({ ref, v, file }) => {
    if (!Object.keys(v).length && !ref) return;
    let id = ref ? "s" + String(ref.n).padStart(2,"0") : null;
    if (!id && v.addr) id = Object.keys(scratch).find(k => !REF_BY_ID[k] && scratch[k].v && norm(scratch[k].v.addr) === norm(v.addr)) || null;
    const isNew = !id || !scratch[id] || !Object.keys(scratch[id].v || {}).length;
    if (!id) id = newId() + ops.length;
    const cur = scratch[id] || { id, ref: ref ? String(ref.n).padStart(2,"0") : "NEW", v:{}, createdAt: Date.now() + ops.length, updatedAt: 0 };
    const set = {}, conf = [];
    Object.keys(v).forEach(k => {
      const mine = cur.v[k];
      if (mine == null || mine === "") set[k] = v[k];
      else if (String(mine).trim() !== String(v[k]).trim()) conf.push({ k, mine, theirs: v[k] });
    });
    const st = isNew ? "added" : (!Object.keys(set).length && !conf.length) ? "same" : "filled";
    const rank = { added: 3, filled: 2, same: 1 };
    if (!status[id] || rank[st] > rank[status[id]]) status[id] = st;
    conf.forEach(c => { const key = id + "|" + c.k + "|" + String(c.theirs).trim(); if (!seenConf.has(key)) { seenConf.add(key); conflicts.push(Object.assign({ id, file }, c)); } });
    cur.v = Object.assign({}, cur.v, set);
    scratch[id] = cur;
    ops.push({ id, ref, set, conf, base: cur });
  });
  const count = st => Object.keys(status).filter(id => status[id] === st).length;
  return { ops, added: count("added"), same: count("same"), filled: count("filled"), conflicts };
}
function applyImport(plan, useFile){
  const now = Date.now();
  plan.ops.forEach(op => {
    const rec = records[op.id] || { id: op.id, ref: op.ref ? String(op.ref.n).padStart(2,"0") : "NEW", v:{}, createdAt: op.base.createdAt, updatedAt: 0 };
    const v = Object.assign({}, rec.v, op.set);
    if (useFile) op.conf.forEach(c => { v[c.k] = c.theirs; });
    rec.v = v; rec.updatedAt = now;
    records[op.id] = rec;
  });
  saveLocal();
}
async function importFiles(files){
  const entries = [], problems = [];
  for (const f of files) {
    try {
      const cols = await readInventory(JSZip, DOMParser, await f.arrayBuffer());
      if (!cols.length) problems.push(`${f.name}: no signs filled in`);
      cols.forEach(c => entries.push(Object.assign(columnToEntry(c.cells), { file: f.name })));
    } catch(e) {
      const why = e.message === "not_xlsx" ? "not an Excel (.xlsx) file"
        : e.message === "no_inventory" ? "no INVENTORY tab"
        : e.message === "wrong_layout" ? "the INVENTORY tab doesn’t match this inventory’s layout"
        : "couldn’t be read";
      problems.push(`${f.name}: ${why}`);
    }
  }
  if (!entries.length) {
    openSheet(`<h2>Nothing imported</h2><ul>${problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <div class="stack"><button class="btn primary" data-act="cancel">OK</button></div>`);
    return;
  }
  const plan = planImport(entries);
  const signName = id => refOf(id) ? "Sign " + plateFor(id) : "New sign at " + (val(id, "addr") || plan.ops.find(o => o.id === id).base.v.addr || "unknown location");
  const lines = [];
  if (plan.added) lines.push(`${plan.added} sign${plan.added === 1 ? "" : "s"} not yet on this phone will be added`);
  if (plan.filled) lines.push(`${plan.filled} sign${plan.filled === 1 ? "" : "s"} already on this phone will get the file’s extra details`);
  if (plan.same) lines.push(`${plan.same} sign${plan.same === 1 ? " matches" : "s match"} this phone already`);
  const fileList = files.length === 1 ? esc(files[0].name) : `${files.length} files`;
  const shorten = s => { s = String(s).replace(/\n/g, " "); return s.length > 60 ? s.slice(0, 57) + "…" : s; };
  const confHtml = plan.conflicts.length ? `
    <p><b>${plan.conflicts.length} answer${plan.conflicts.length === 1 ? " differs" : "s differ"}</b> between this phone and the file:</p>
    <div class="conf">${plan.conflicts.slice(0, 40).map(c => `<div><b>${esc(signName(c.id))}, ${esc(FIELD_NAME(c.k))}</b><br>This phone: ${esc(shorten(c.mine))}<br>File: ${esc(shorten(c.theirs))}</div>`).join("")}
    ${plan.conflicts.length > 40 ? `<div>…and ${plan.conflicts.length - 40} more</div>` : ""}</div>` : "";
  openSheet(`<h2>Import ${fileList}</h2>
    <ul>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    ${problems.length ? `<p>Skipped:</p><ul>${problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${confHtml}
    <div class="stack">
      ${plan.conflicts.length
        ? `<button class="btn primary" data-act="keep">Import, keep this phone’s answers</button>
           <button class="btn" data-act="theirs">Import, use the file’s answers</button>`
        : `<button class="btn primary" data-act="keep">Import</button>`}
      <button class="btn" data-act="cancel" style="border-color:var(--line);color:var(--ink)">Cancel</button>
    </div>`, (act) => {
    if (act !== "keep" && act !== "theirs") return;
    applyImport(plan, act === "theirs");
    closeSheet();
    if (currentId()) renderSign(currentId()); else renderHome();
    const n = plan.added + plan.filled; toast(n ? `Imported ${n} sign${n === 1 ? "" : "s"}.` : "Nothing new to import.");
  });
}

render();

/* ---------- offline support ---------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
})();

</script>
